name: CodeQL

on:
  pull_request:
    branches:
      - feature/**
      - release/**
      - main
  push:
    branches:
      - main

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    uses: axisparkjs-org/.github/.github/workflows/codeql.yml@main
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    with:
      # Build output, generated files, tests and examples that are not part of the published packages.
      # `templates/` is analyzed because its code is copied into the projects created by the CLI.
      paths-ignore: |
        **/lib/**
        **/coverage/**
        samples/**
        e2e/**
        **/*.spec.ts
