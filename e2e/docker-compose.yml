services:
    postgres:
        container_name: postgres
        image: postgres:16-alpine
        ports:
            - '5432:5432'
        environment:
            POSTGRES_USER: axispark
            POSTGRES_PASSWORD: axispark
            POSTGRES_DB: axispark_testing
        tty: true
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U axispark -d axispark_primary']
            interval: 5s
            timeout: 5s
            retries: 5
    
    mysql:
        container_name: mysql
        image: mysql:8.0
        ports:
            - '3306:3306'
        environment:
            MYSQL_ROOT_PASSWORD: axispark
            MYSQL_USER: axispark
            MYSQL_PASSWORD: axispark
            MYSQL_DATABASE: axispark_testing
        tty: true
        healthcheck:
            test: ['CMD-SHELL', 'mysqladmin ping -h localhost -u axispark -paxispark']
            interval: 5s
            timeout: 5s
            retries: 5
    
    mongodb:
        container_name: mongodb
        image: mongo:6.0
        ports:
            - '27017:27017'
        environment:
            MONGO_INITDB_ROOT_USERNAME: axispark
            MONGO_INITDB_ROOT_PASSWORD: axispark
        tty: true
        healthcheck:
            test: ["CMD","mongosh", "--host", "localhost", "--port", "27017", "--eval", "db.adminCommand('ping')"]
            interval: 5s
            timeout: 5s
            retries: 5

    rabbitmq:
        container_name: rabbitmq
        hostname: rabbitmq
        image: 'rabbitmq:management-alpine'
        ports:
            - '15672:15672'
            - '5672:5672'
        tty: true
        healthcheck:
            test: rabbitmq-diagnostics -q ping
            interval: 5s
            timeout: 5s
            retries: 5

    redis:
        container_name: redis
        image: redis:8-alpine
        ports:
            - '6379:6379'
        tty: true
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 5

    kafka:
        image: apache/kafka:latest
        container_name: kafka
        ports:
            - '9092:9092'
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
            KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
            KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        tty: true
        healthcheck:
            test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1']
            interval: 5s
            timeout: 5s
            retries: 5
